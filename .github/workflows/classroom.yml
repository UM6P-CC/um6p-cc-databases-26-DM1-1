name: Autograde



# Path detection uses dorny/paths-filter, which diffs across the FULL set of
# commits in a push -- unlike GitHub's built-in github.event.head_commit,
# which only reflects the single most recent commit and silently misses
# changes from earlier commits in a multi-commit push.
on:
  push:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      lab0_changed: ${{ steps.filter.outputs.lab0 }}
      lab3_changed: ${{ steps.filter.outputs.lab3 }}
      lab4_changed: ${{ steps.filter.outputs.lab4 }}
      lab5_changed: ${{ steps.filter.outputs.lab5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lab0:
              - 'tests/test_lab0.py'
              - 'tests/requirements.txt'
            lab3:
              - 'tests/test_lab3.py'
              - 'tests/schema.sql'
              - 'tests/seed.sql'
            lab4:
              - 'tests/test_lab4.py'
              - 'tests/schema.sql'
              - 'tests/lab4_seed.sql'
            lab5:
              - 'tests/test_lab5.py'
              - 'tests/schema.sql'
              - 'tests/lab5_seed.sql'

  # LAB 0 -- only runs if tests/test_lab0.py (or requirements.txt) changed
  grade-lab0:
    needs: detect-changes
    if: needs.detect-changes.outputs.lab0_changed == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r tests/requirements.txt
      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent
          do
            sleep 2
          done
      - name: Run Lab 0 tests only
        run: pytest tests/test_lab0.py -v --tb=short

  # LAB 3 -- only runs if tests/test_lab3.py, schema.sql, or seed.sql changed
  grade-lab3:
    needs: detect-changes
    if: needs.detect-changes.outputs.lab3_changed == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r tests/requirements.txt
      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent
          do
            sleep 2
          done


      - name: Reconstruct private Lab 3 files
        env:
          LAB3_PRIVATE_BUNDLE_B64: ${{ secrets.LAB3_PRIVATE_BUNDLE_B64 }}
        run: |
          if [ -z "$LAB3_PRIVATE_BUNDLE_B64" ]; then
            echo "::error::LAB3_PRIVATE_BUNDLE_B64 secret is not set."
            exit 1
          fi
          echo "$LAB3_PRIVATE_BUNDLE_B64" | base64 -d > /tmp/lab3_private_bundle.tar.gz
          tar xzf /tmp/lab3_private_bundle.tar.gz -C tests
          rm -f /tmp/lab3_private_bundle.tar.gz
      - name: Run Lab 3 tests only
        run: pytest tests/test_lab3.py -v --tb=short
      - name: Clean up reconstructed private files
        if: always()
        run: rm -f tests/lab3_answers.py tests/lab3_answers_shadow.py tests/seed_shadow.sql

  # LAB 4 -- only runs if tests/test_lab4.py, schema.sql, or lab4_seed.sql
  grade-lab4:
    needs: detect-changes
    if: needs.detect-changes.outputs.lab4_changed == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r tests/requirements.txt
      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent
          do
            sleep 2
          done

      - name: Reconstruct private Lab 4 files
        env:
          LAB4_PRIVATE_BUNDLE_B64: ${{ secrets.LAB4_PRIVATE_BUNDLE_B64 }}
        run: |
          if [ -z "$LAB4_PRIVATE_BUNDLE_B64" ]; then
            echo "::error::LAB4_PRIVATE_BUNDLE_B64 secret is not set. Add it under Settings > Secrets and variables > Actions (instructor-only, one-time setup)."
            exit 1
          fi
          echo "$LAB4_PRIVATE_BUNDLE_B64" | base64 -d > /tmp/lab4_private_bundle.tar.gz
          tar xzf /tmp/lab4_private_bundle.tar.gz -C tests
          rm -f /tmp/lab4_private_bundle.tar.gz
      - name: Run Lab 4 tests only
        run: pytest tests/test_lab4.py -v --tb=short
      - name: Clean up reconstructed private files
        if: always()
        run: rm -f tests/lab4_answers.py tests/lab4_answers_shadow.py tests/lab4_seed_shadow.sql

  # ==========================================================================
  # LAB 5 -- only runs if tests/test_lab5.py, schema.sql, or lab5_seed.sql
  # changed. Same dual-dataset / private-bundle pattern as Lab 3/Lab 4,
  # covering the 4 views + 4 triggers (the application layer is graded
  # manually, not by this job).
  # ==========================================================================
  grade-lab5:
    needs: detect-changes
    if: needs.detect-changes.outputs.lab5_changed == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r tests/requirements.txt
      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent
          do
            sleep 2
          done

    
      - name: Reconstruct private Lab 5 files
        env:
          LAB5_PRIVATE_BUNDLE_B64: ${{ secrets.LAB5_PRIVATE_BUNDLE_B64 }}
        run: |
          if [ -z "$LAB5_PRIVATE_BUNDLE_B64" ]; then
            echo "::error::LAB5_PRIVATE_BUNDLE_B64 secret is not set. Add it under Settings > Secrets and variables > Actions (instructor-only, one-time setup)."
            exit 1
          fi
          echo "$LAB5_PRIVATE_BUNDLE_B64" | base64 -d > /tmp/lab5_private_bundle.tar.gz
          tar xzf /tmp/lab5_private_bundle.tar.gz -C tests
          rm -f /tmp/lab5_private_bundle.tar.gz
      - name: Run Lab 5 tests only
        run: pytest tests/test_lab5.py -v --tb=short
      - name: Clean up reconstructed private files
        if: always()
        run: rm -f tests/lab5_answers.py tests/lab5_answers_shadow.py tests/lab5_seed_shadow.sql